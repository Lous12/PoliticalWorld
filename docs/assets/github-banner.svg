<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <circle cx="1280" cy="120" r="140" fill="#1d4ed8" opacity="0.18"/>
  <circle cx="1390" cy="340" r="170" fill="#7c3aed" opacity="0.14"/>
  <circle cx="220" cy="390" r="120" fill="#06b6d4" opacity="0.12"/>
  <rect x="72" y="70" rx="26" ry="26" width="190" height="190" fill="#111827" stroke="#334155" stroke-width="3" filter="url(#shadow)"/>
  <rect x="92" y="90" rx="18" ry="18" width="150" height="150" fill="url(#accent)" opacity="0.9"/>
  <text x="167" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff">PW</text>
  <text x="320" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Political World</text>
  <text x="322" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#f59e0b">Politics mod • Public API • Addon Framework</text>
  <text x="322" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cbd5e1">Play politics. Build anything.</text>

  <g filter="url(#shadow)">
    <rect x="320" y="320" rx="18" ry="18" width="210" height="84" fill="#111827" stroke="#334155"/>
    <text x="350" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#60a5fa">POLITICAL WORLD</text>
    <text x="350" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">1.7 Public Beta</text>

    <rect x="550" y="320" rx="18" ry="18" width="180" height="84" fill="#111827" stroke="#334155"/>
    <text x="580" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#a78bfa">PUBLIC API</text>
    <text x="580" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">1.9.0</text>

    <rect x="750" y="320" rx="18" ry="18" width="220" height="84" fill="#111827" stroke="#334155"/>
    <text x="780" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#34d399">COMPATIBILITY</text>
    <text x="780" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">WorldBox 0.51.2 • NML 1.2.0.1</text>
  </g>

  <text x="1320" y="455" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94a3b8">github.com/Lous12/PoliticalWorld</text>
</svg>
